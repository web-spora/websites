<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Market — площадка невостребованных остатков</title>
  <link rel="icon" href="image/favicon.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #222; background: #f8f9fa; }
    .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #01579b 100%); color: #fff; }
    .hero-logo { width: 120px; height: 120px; margin-bottom: 24px; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 16px; font-weight: 700; }
    .hero p { font-size: 1.2rem; max-width: 600px; opacity: .9; margin-bottom: 40px; line-height: 1.6; }
    .hero-cities { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .city-card { background: rgba(255,255,255,.12); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.2); border-radius: 16px; padding: 32px 40px; text-align: center; transition: transform .2s, background .2s; text-decoration: none; color: #fff; min-width: 220px; }
    .city-card:hover { transform: translateY(-4px); background: rgba(255,255,255,.2); }
    .city-card .city-name { font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; }
    .city-card .city-desc { font-size: .9rem; opacity: .8; }
    .footer { text-align: center; padding: 24px; font-size: .85rem; color: #666; background: #fff; }
    .footer a { color: #0d47a1; text-decoration: none; }
    @media (max-width: 600px) { .hero h1 { font-size: 1.8rem; } .city-card { min-width: 160px; padding: 24px; } }
  </style>
</head>
<body>
  <section class="hero">
    <img src="image/logo.svg" alt="E-Market" class="hero-logo">
    <h1>Площадка невостребованных остатков</h1>
    <p>Покупайте качественные материалы со складов по сниженным ценам. Выберите свой город:</p>
    <div class="hero-cities">
      <a href="cat_city1.html" class="city-card">
        <div class="city-name">Москва</div>
        <div class="city-desc">ООО Ромашка</div>
      </a>
      <a href="cat_city2.html" class="city-card">
        <div class="city-name">Санкт-Петербург</div>
        <div class="city-desc">ИП Иванов</div>
      </a>
    </div>
  </section>
  <div class="footer">
    <a href="privacy.html">Политика конфиденциальности</a> &middot; &copy; 2026 E-Market
  </div>
</body>
</html>

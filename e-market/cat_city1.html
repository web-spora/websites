<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Москва — каталог | E-Market</title>
  <link rel="icon" href="image/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a class="header-logo" href="index.html"><img src="image/logo.svg" class="header-logo-img"></a>
  <nav class="header-nav">
    <a href="cat_city1.html" class="header-link active">Москва</a>
    <a href="cat_city2.html" class="header-link">Санкт-Петербург</a>
    <a href="#contacts" class="header-link">Контакты</a>
  </nav>
  <a href="#" onclick="showCart()" class="cart-toggle">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span id="cartBadge" style="display:none">0</span>
  </a>
  <button class="burger" onclick="toggleBurger(this)">☰</button>
</header>

<div class="mobile-nav">
  <a href="cat_city1.html" class="mobile-link active">Москва</a>
  <a href="cat_city2.html" class="mobile-link">Санкт-Петербург</a>
  <a href="#contacts" class="mobile-link">Контакты</a>
</div>

<main class="content">
  <h1 class="page-title">Каталог — Москва</h1>

  <div id="filters" class="filters">
    <div class="filter-group">
      <label>Продавец</label>
      <select id="filter-org"><option value="all">Все</option></select>
    </div>
    <div class="filter-group">
      <label>Бренд</label>
      <select id="filter-brand"><option value="all">Все</option></select>
    </div>
    <div class="filter-group">
      <label>Назначение</label>
      <select id="filter-cat">
        <option value="all">Все</option>
        <option value="Моторное">Моторное</option>
        <option value="Трансмиссионное">Трансмиссионное</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Остаток</label>
      <select id="filter-qty">
        <option value="all">Все</option>
        <option value="asc">По возрастанию</option>
        <option value="desc">По убыванию</option>
      </select>
    </div>
  </div>

  <div id="summary" class="summary">Показано: 0 из 0</div>

  <div id="container" class="cards-container">Загрузка данных...</div>
</main>

<div id="cartOverlay" class="cart-overlay" onclick="hideCart()"></div>
<div id="cartPanel" class="cart-panel">
  <div class="cart-panel-header">
    Корзина <button class="cart-panel-close" onclick="hideCart()">✕</button>
  </div>
  <div id="cartBody" class="cart-panel-body">
    <div class="cart-empty">Корзина пуста</div>
  </div>
  <div id="cartFooter" class="cart-panel-footer" style="display:none">
    <form class="cart-form" onsubmit="event.preventDefault(); cartSubmit()">
      <input type="text" id="orderName" placeholder="Имя *" required>
      <input type="tel" id="orderPhone" placeholder="+7 (___) ___-__-__" oninput="formatPhone(this)" required>
      <input type="email" id="orderEmail" placeholder="Email">
      <textarea id="orderComment" placeholder="Комментарий"></textarea>
      <label class="cart-consent">
        <input type="checkbox" id="orderConsent" required>
        Согласен с <a href="privacy.html" target="_blank">политикой обработки данных</a> *
      </label>
      <button type="submit" class="cart-submit">Отправить заказ</button>
      <div id="cartStatus" class="cart-status"></div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<a href="#" class="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false">↑</a>

<div id="contacts" class="contacts-section">
  <div class="contacts-inner">
    <h2>Контакты</h2>
    <p>Email: info@e-market.ru</p>
    <p>Телефон: +7 (495) 000-00-00</p>
    <p>&copy; 2026 E-Market</p>
  </div>
</div>

<script src="script_city1.js"></script>
</body>
</html>
